services:
  # n8n is an optional add-on (4.2) — scheduled pushes were removed, so its main
  # job disappeared. Opt in with: docker compose --profile n8n up -d
  n8n:
    profiles:
      - n8n
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    profiles:
      - full
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      SQLITE_PATH: /app/data/dsa.db
    volumes:
      - ../data/sqlite:/app/data

volumes:
  n8n_data:
